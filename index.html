:root{
  /* Camel race on a Dhofar sand track: one lane per child, sky strip above, warm ink outlines; each child's color rides on the camel blanket. */
  --sky:#9ED8F3;
  --sand:#F2D194;
  --ink:#3A2513;
  --paper:#FFF9EE;
  --good:#1C9A57;
  --warn:#E5701C;
  --gold:#FFC22E;
  --font-display:'Lalezar','Baloo Bhaijaan 2','Segoe UI',Tahoma,sans-serif;
  --font-body:'Baloo Bhaijaan 2','Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;
  --r:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#F5E4C2;color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:3px solid #1565C0;outline-offset:2px}
[hidden]{display:none !important}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
[dir="rtl"] .ic.mirror{transform:scaleX(-1)}

#app{height:100%;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
.topbar{flex:none;display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--paper);border-bottom:3px solid var(--ink);position:relative;z-index:6}
.brand{display:flex;align-items:center;gap:10px;flex:0 50 auto;min-width:110px}
.brand > div{min-width:0;overflow:hidden}
.mark{width:56px;height:43px;flex:none;display:block}
.mark svg{width:100%;height:100%;overflow:visible;display:block}
.brand h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(25px,2.3vw,34px);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{font-size:15px;font-weight:700;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cls-btn{display:block;max-width:100%;text-align:start;text-decoration:underline dotted rgba(58,37,19,.55);text-underline-offset:4px}
.cls-btn:hover{opacity:1}
.tools{margin-inline-start:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tool{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 10px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;font-weight:800;font-size:16px;box-shadow:0 3px 0 var(--ink);transition:transform .08s ease,box-shadow .08s ease,background .15s;white-space:nowrap}
.tool:hover{background:#FFF3D6}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tool:disabled{opacity:.35;transform:none;box-shadow:0 3px 0 var(--ink)}
.tool.icon{width:42px;padding:0;justify-content:center}
.tool.storm-btn{background:#F8D9A8}
.tool.storm-btn:hover{background:#F4C985}
.tool.class-btn{background:#DDF3E4}
.tool.class-btn:hover{background:#C9ECD5}
.tool.names-btn{background:var(--gold)}
.tool.install-btn{background:#1C9A57;color:#fff}
.tool.install-btn:hover{background:#178A4D}
.tool.newrace-btn{background:#DCEBFF}
.tool.newrace-btn:hover{background:#C8DFFF}
.tool.reset-btn{background:#FFE3DF;color:#8C1D18}
.tool.reset-btn:hover{background:#FFD3CD}
.tool.on{background:var(--ink);color:var(--paper)}
.tools .sep{width:2px;height:28px;background:rgba(58,37,19,.2);margin:0 2px}
@media (max-width:1560px){.tool .lbl:not(.keep):not(.keep2){display:none}}
@media (max-width:1440px){.mark{display:none}.tools{gap:5px}.tool{font-size:15px}.tool:not(.icon){padding:0 9px}}
@media (max-width:1180px){.tool .lbl.keep{display:none}.mark{display:none}.tools{gap:5px}.tool.icon{width:40px}.tool:not(.icon){padding:0 9px}.tools .sep{display:none}}

.bar{flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 16px;color:#fff;font-weight:700;position:relative;z-index:5}
.attbar{background:#2D6CCF}
.selbar{background:#7B4BD1}
.bar .count{margin-inline-start:auto;font-family:var(--font-display);font-weight:400;font-size:21px}
.bar button{background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:12px;padding:3px 16px;font-weight:800;box-shadow:0 3px 0 var(--ink)}
.bar button.good{background:var(--good);color:#fff}
.bar button.warn{background:var(--warn);color:#fff}
.bar button.unstar-bar{background:#FFE3DF;color:#8C1D18}
.bar button.unstar-bar::before{content:"⭐ "}
.bar button:disabled{opacity:.45}

/* ---------- scene & field ---------- */
.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.sky-chips{position:absolute;top:calc(clamp(40px,6.5vh,72px) / 2);left:50%;transform:translate(-50%,-50%);z-index:4;display:flex;gap:10px;max-width:calc(100% - 16px)}
.sky-chip{display:inline-flex;align-items:center;gap:8px;min-width:0;height:clamp(32px,4.8vh,44px);padding:0 16px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);font-weight:800;font-size:clamp(14px,2vh,18px);box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.sky-chip .m-ic{font-size:1.3em;line-height:1;flex:none}
.sky-chip .m-txt{overflow:hidden;text-overflow:ellipsis}
.sky-chip:hover{background:#FFF3D6}
.period-chip.on{background:#1C9A57;color:#fff}
.period-chip.on:hover{background:#178A4D}
.mystery.on{background:var(--ink);color:#FFE28A;animation:mpulse 2.4s ease-in-out infinite}
@keyframes mpulse{0%,100%{box-shadow:0 3px 0 #000,0 0 0 0 rgba(255,194,46,.6)}50%{box-shadow:0 3px 0 #000,0 0 0 12px rgba(255,194,46,0)}}
.scene{position:relative;flex:none;height:clamp(40px,6.5vh,72px);background:linear-gradient(180deg,#8CCFF0 0%,#BFE5F5 62%,#F7E5BC 100%);overflow:hidden;border-bottom:3px solid var(--ink)}
.sun{position:absolute;top:14%;left:4%;width:clamp(22px,4vh,42px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FFF3BF,#FFC93F 72%);box-shadow:0 0 0 6px rgba(255,214,102,.28),0 0 34px 10px rgba(255,214,102,.45)}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:100%}
.palm{position:absolute;bottom:-3px;height:100%;width:auto}
.palm.a{left:16%}
.palm.b{left:49%;height:78%}
.palm.c{left:83%;height:90%}

.field{--tag-w:150px;--camel-w:60px;--camel-h:45px;--lane-h:50px;--finish-w:28px;flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:12px;padding:10px 12px 14px;background:#F3DFB6}
.col{min-height:0;display:flex;flex-direction:column;border:3px solid var(--ink);border-radius:var(--r);overflow:hidden;background:var(--sand);box-shadow:0 4px 0 var(--ink)}
.col-head{position:relative;flex:none;height:30px;background:#E6BC72;border-bottom:2.5px solid var(--ink)}
.post{position:absolute;top:50%;font-family:var(--font-display);font-weight:400;font-size:16px;line-height:1.5;background:var(--paper);border:2px solid var(--ink);border-radius:9px;padding:0 9px;white-space:nowrap}
.start-post{right:calc(var(--tag-w) + var(--camel-w));transform:translate(50%,-50%)}
.finish-post{left:5px;transform:translateY(-50%)}
.lanes{flex:1;min-height:0;display:grid;grid-template-rows:repeat(var(--per),minmax(38px,1fr));overflow:auto}
.lane{position:relative;display:block;width:100%;min-height:0;text-align:start;border-top:2px dashed rgba(255,255,255,.85);background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(120,70,10,.04)),var(--sand);transition:background-color .2s}
.lane:first-child{border-top:0}
.lane:nth-child(even){background-color:#EDC680}
.lane:hover{background-color:#F7DCA6}
.tag{position:absolute;top:0;bottom:0;right:0;width:var(--tag-w);display:flex;align-items:center;gap:6px;padding-inline:6px 8px;background:linear-gradient(270deg,color-mix(in srgb,var(--c) 30%,#fff),color-mix(in srgb,var(--c) 12%,#fff));border-left:2.5px solid color-mix(in srgb,var(--c) 60%,var(--ink));z-index:1}
.tag .av{--s:calc(min(var(--lane-h),64px) * .74);position:relative;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--ink);font-size:calc(var(--s) * .6);line-height:1}
.tag .nm{flex:1;min-width:0;font-weight:800;font-size:clamp(14px,calc(var(--lane-h) * .37),24px);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag .st{flex:none;font-size:clamp(11px,calc(var(--lane-h) * .27),17px);font-weight:800;color:#7A4E00;background:#FFF1C7;border:1.5px solid rgba(122,78,0,.3);border-radius:999px;padding:0 6px;white-space:nowrap}
.tag .st:empty{display:none}
.startline{position:absolute;top:10%;bottom:10%;right:calc(var(--tag-w) + var(--camel-w));border-right:2.5px dashed rgba(58,37,19,.3)}
.finish{position:absolute;top:0;bottom:0;left:calc(var(--finish-w) - 12px);width:12px;background:conic-gradient(var(--ink) 25%,#fff 0 50%,var(--ink) 0 75%,#fff 0) 0 0/12px 12px;border-inline:1.5px solid var(--ink)}
.run{position:absolute;top:0;bottom:0;left:var(--finish-w);right:calc(var(--tag-w) + var(--camel-w))}
.dot{position:absolute;top:58%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(58,37,19,.2)}
.dot.m5{width:10px;height:10px;margin:-5px 0 0 -5px;background:rgba(58,37,19,.36)}
.gift{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:clamp(14px,calc(var(--lane-h) * .55),38px);line-height:1;filter:drop-shadow(0 2px 0 rgba(58,37,19,.35));animation:float 1.8s ease-in-out infinite}
.gift.used{opacity:.25;filter:grayscale(1);animation:none}
@keyframes float{50%{transform:translate(-50%,-64%)}}
.camel{position:absolute;bottom:3%;left:100%;width:var(--camel-w);height:var(--camel-h);transition:left .95s cubic-bezier(.3,.75,.35,1);z-index:2;pointer-events:none}
.camel > svg{width:100%;height:100%;overflow:visible;display:block}
.camel .count{position:absolute;bottom:0;left:calc(var(--camel-h) * -.3);min-width:calc(var(--camel-h) * .46);height:calc(var(--camel-h) * .46);padding:0 4px;border-radius:999px;background:#fff;border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);font-family:var(--font-display);font-weight:400;font-size:calc(var(--camel-h) * .3);line-height:calc(var(--camel-h) * .4);text-align:center}
.lane.done .camel .count{background:#FFF1C7;font-family:var(--font-body)}
.camel.backing{animation:backShake .55s}
@keyframes backShake{20%{transform:translateX(5px) rotate(2deg)}40%{transform:translateX(-4px) rotate(-2deg)}60%{transform:translateX(3px)}80%{transform:translateX(-2px)}}
.lane.top .camel > svg{animation:hop .55s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-6px) rotate(-3deg)}}

.tag .av.pop{animation:chipPop .55s}

/* camel drawing */
.camel-svg .shadow{fill:rgba(58,37,19,.2)}
.camel-svg .torso,.camel-svg .headshape{fill:#D9A05B;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.camel-svg .neck-o{fill:none;stroke:var(--ink);stroke-width:17;stroke-linecap:round}
.camel-svg .neck{fill:none;stroke:#D9A05B;stroke-width:12;stroke-linecap:round}
.camel-svg .leg rect{fill:#D9A05B;stroke:var(--ink);stroke-width:2.5}
.camel-svg .leg.far rect{fill:#B5803F}
.camel-svg .tail{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.camel-svg .blanket{fill:var(--tc);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.camel-svg .fringe{fill:none;stroke:#FFE28A;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.camel-svg .ear{fill:#C48A48;stroke:var(--ink);stroke-width:2}
.camel-svg .eye,.camel-svg .nostril{fill:var(--ink)}
.camel-svg .eye-hi{fill:#fff}
.camel-svg .mouth{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.camel-svg .cheek{fill:#F2917F;opacity:.55}
.camel-svg .pole{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.camel-svg .cloth{fill:var(--tc);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.camel-svg .femoji{font-size:13px;dominant-baseline:central}
.camel-svg .leg{transform-box:fill-box;transform-origin:50% 6%}
.walking .camel-svg .leg.a{animation:swingA .3s ease-in-out infinite alternate}
.walking .camel-svg .leg.b{animation:swingB .3s ease-in-out infinite alternate}
.walking .camel-svg .body,.walking .camel-svg .flag{animation:bob .3s ease-in-out infinite alternate}
@keyframes swingA{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes swingB{from{transform:rotate(16deg)}to{transform:rotate(-16deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
/* camel levels */
.camel-svg .acc{display:none}
.camel-svg.lv2 .l2,.camel-svg.lv3 .l2,.camel-svg.lv4 .l2,.camel-svg.lv5 .l2,
.camel-svg.lv3 .l3,.camel-svg.lv4 .l3,.camel-svg.lv5 .l3,
.camel-svg.lv4 .l4,.camel-svg.lv5 .l4,.camel-svg.lv5 .l5{display:inline}
.camel-svg.lv5 .torso,.camel-svg.lv5 .headshape{fill:#F2C23E}
.camel-svg.lv5 .neck{stroke:#F2C23E}
.camel-svg.lv5 .leg rect{fill:#F2C23E}
.camel-svg.lv5 .leg.far rect{fill:#D49B17}
.camel-svg.lv5 .ear{fill:#D9A62A}
.camel-svg.lv5{filter:drop-shadow(0 0 5px rgba(255,196,40,.9))}
.camel-svg .spk{fill:#FFF3B0;stroke:#D49B17;stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:twinkle 1.6s ease-in-out infinite}
.camel-svg .spk.d2{animation-delay:.5s}
.camel-svg .spk.d3{animation-delay:1s}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
.camel-svg .bell{transform-box:fill-box;transform-origin:50% 0}
.walking .camel-svg .bell{animation:bellSwing .3s ease-in-out infinite alternate}
@keyframes bellSwing{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}

.win-line{font-family:var(--font-display);font-weight:400;font-size:clamp(22px,2.8vw,32px);margin:0 0 8px}
.per-results{width:min(1000px,100%)}

/* storm */
.storm-ov{z-index:55;background:radial-gradient(ellipse at 50% 45%,rgba(226,176,104,.78),rgba(146,96,38,.93))}
.storm-card{display:grid;justify-items:center;gap:6px;text-align:center;color:#fff;max-width:820px}
.storm-card .gust{width:clamp(110px,16vw,170px);height:auto;animation:gust 1.1s ease-in-out infinite alternate}
@keyframes gust{from{transform:translateX(14px)}to{transform:translateX(-14px)}}
.storm-title{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(56px,9vw,120px);line-height:1.1;text-shadow:3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),0 8px 0 var(--ink)}
.storm-text{margin:0;font-size:clamp(20px,2.5vw,30px);font-weight:800;text-shadow:0 2px 0 rgba(58,37,19,.6)}
.storm-text.call{font-size:clamp(24px,3.2vw,40px);margin:8px 0 18px}

/* settings */
.set-dialog{width:min(1020px,100%)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px;padding-inline-end:58px}
.tab{padding:5px 18px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;font-weight:800;box-shadow:0 3px 0 var(--ink)}
.tab.sel{background:var(--ink);color:var(--paper)}
.field-in{display:flex;flex-direction:column;gap:6px;font-weight:800}
.field-in small{font-weight:600;opacity:.7}
textarea,input[type=text]{width:100%;border:2.5px solid var(--ink);border-radius:14px;background:#fff;padding:9px 12px;font-size:19px;font-weight:600}
textarea{resize:vertical;min-height:230px;line-height:1.65}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:2px dashed rgba(58,37,19,.15);font-weight:800;cursor:pointer}
.switch{appearance:none;-webkit-appearance:none;margin:0;width:60px;height:34px;border-radius:999px;background:#D9C9AA;border:2.5px solid var(--ink);position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;right:2px;width:25px;height:25px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:right .2s}
.switch:checked{background:var(--good)}
.switch:checked::after{right:calc(100% - 29px)}
.seg{display:inline-flex;border:2.5px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff;flex:none}
.seg button{padding:6px 16px;font-weight:800;border-inline-start:2px solid var(--ink)}
.seg button:first-child{border-inline-start:0}
.seg button.sel{background:var(--ink);color:var(--paper)}
.sec-h{font-family:var(--font-display);font-weight:400;font-size:25px;line-height:1.2;margin:20px 0 10px}
.emo{text-align:center;font-size:24px !important;padding:4px !important}
.beh-row{display:grid;grid-template-columns:66px minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:center;margin-bottom:8px}
.beh-row.pos{grid-template-columns:66px minmax(0,1fr) 46px}
.beh-row input{font-size:18px;padding:7px 10px}
.icon-btn{width:46px;height:46px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center}

/* intro */
.intro-ov{z-index:58;padding:0;place-items:stretch;background:linear-gradient(180deg,#8CCFF0 0%,#C6E8F6 55%,#F4DDAE 55.2%,#EDC67E 100%)}
.intro{position:relative;min-height:100%;width:100%;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);align-items:center;gap:clamp(16px,3vw,48px);padding:clamp(18px,3.4vw,56px)}
.intro-sun{position:absolute;top:6%;left:7%;width:clamp(60px,9vw,120px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FFF3BF,#FFC93F 72%);box-shadow:0 0 0 14px rgba(255,214,102,.25),0 0 70px 26px rgba(255,214,102,.45)}
.intro-title{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(56px,min(8.4vw,15vh),140px);line-height:1.02;color:var(--gold);text-shadow:4px 4px 0 var(--ink),-4px 4px 0 var(--ink),4px -4px 0 var(--ink),-4px -4px 0 var(--ink),0 5px 0 var(--ink),0 -5px 0 var(--ink),5px 0 0 var(--ink),-5px 0 0 var(--ink),0 12px 0 var(--ink)}
.intro-sub{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 12px}
.intro-sub span{background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:1px 16px;font-weight:800;font-size:clamp(16px,1.6vw,22px);box-shadow:0 3px 0 var(--ink)}
.howto{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:12px 18px 14px;margin-bottom:16px}
.howto h3{margin:0 0 10px;font-family:var(--font-display);font-weight:400;font-size:clamp(24px,2.5vw,36px);line-height:1.2}
.how-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.how{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:7px 6px;border-radius:16px;background:#E5F5EA;border:2px solid rgba(28,154,87,.35);font-weight:800;font-size:clamp(14px,1.25vw,18px);line-height:1.25}
.how .e{font-size:clamp(24px,min(2.6vw,4.6vh),38px);line-height:1.1}
.rules{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-weight:800;font-size:clamp(15px,1.3vw,19px)}
.rules li{display:flex;align-items:center;gap:8px}
.rules li span{font-size:1.3em;line-height:1}
.btn.start{font-family:var(--font-display);font-weight:400;font-size:clamp(26px,2.8vw,40px);min-height:66px;padding:0 42px;border-radius:22px;box-shadow:0 6px 0 var(--ink)}
.credit{margin:10px 0 0;font-size:15px;font-weight:700;opacity:.78}
.intro-art{position:relative;align-self:end;display:flex;flex-direction:column;align-items:stretch;padding-bottom:4vh}
.intro-camel{width:min(100%,330px);aspect-ratio:4/3;animation:introIn .9s cubic-bezier(.3,1.2,.4,1) both}
.intro-camel svg{width:100%;height:100%;overflow:visible;display:block}
.intro-camel:nth-child(1){align-self:flex-end;animation-delay:.1s}
.intro-camel:nth-child(2){align-self:flex-start;margin-top:-16%;animation-delay:.25s}
.intro-camel:nth-child(3){align-self:center;margin-top:-16%;animation-delay:.4s}
@keyframes introIn{from{transform:translateX(-60px);opacity:0}}
.ladder{align-self:center;background:rgba(255,249,238,.88);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:14px 16px 10px}
.ladder h3{margin:0 0 6px;font-family:var(--font-display);font-weight:400;font-size:clamp(22px,2.3vw,32px);line-height:1.2;text-align:center}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.stepc{display:flex;align-items:center;gap:10px;padding:2px 10px;border-radius:16px;background:linear-gradient(270deg,#F6DDA8,#FBEBCB);border:2px solid rgba(58,37,19,.18)}
.stepc:nth-child(1){margin-inline-start:24%;background:linear-gradient(270deg,#FFE08A,#FFF3C4);border-color:#C98A00}
.stepc:nth-child(2){margin-inline-start:18%}
.stepc:nth-child(3){margin-inline-start:12%}
.stepc:nth-child(4){margin-inline-start:6%}
.lv-cam{width:clamp(64px,7vw,96px);aspect-ratio:4/3;flex:none}
.lv-cam svg{width:100%;height:100%;overflow:visible;display:block}
.lv-lab{display:flex;flex-direction:column;line-height:1.25}
.lv-lab b{font-size:clamp(15px,1.35vw,19px)}
.lv-lab small{font-size:clamp(13px,1.1vw,16px);font-weight:800;color:#7A4E00}

.loading-ov{z-index:90;background:#F5E4C2}
.loading{display:grid;justify-items:center;gap:14px;font-weight:800;font-size:20px}
.spinner{width:56px;height:56px;border-radius:50%;border:6px solid rgba(58,37,19,.15);border-top-color:var(--ink);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- small screens ---------- */
@media (max-width:900px){
  .how-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .intro{grid-template-columns:1fr}
  .intro-art{flex-direction:row;justify-content:center;padding-bottom:0;order:-1}
  .intro-camel{width:min(32%,180px);margin-top:0 !important}
  .ladder{order:-1}
  .steps{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .stepc{margin-inline-start:0 !important;flex-direction:column;gap:0;padding:4px 6px;text-align:center}
  .lv-lab small{display:none}
}
@media (max-width:760px){
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  .topbar{flex-wrap:wrap}
  .tools{width:100%;justify-content:flex-start}
  .field{flex:none;grid-template-columns:1fr;padding:8px}
  .lanes{grid-template-rows:none;grid-auto-rows:56px;overflow:visible}
  .grid2,.rules{grid-template-columns:1fr}
  .beh-row{grid-template-columns:56px minmax(0,1fr) 46px}
  .beh-row .tip{grid-column:2 / 3}
  .dialog{padding:20px 16px}
  .toast{bottom:12px}
  .sky-chips{gap:6px}
  .sky-chip{padding:0 10px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

</style>

const Cloud = {
  ref: null, ready: false, status: 'none', writing: false, again: false, timer: null, retried: false,
  schedule(){ if (!this.ref || !this.ready) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 800); },
  async flush(){
    if (!this.ref) return;
    if (this.writing){ this.again = true; return; }
    this.writing = true; this.again = false;
    try { await this.ref.set(clone(A)); this.status = 'cloud'; this.retried = false; }
    catch (e){
      const c = e && e.code;
      if (c === 'unavailable' && !this.retried){ this.retried = true; setTimeout(() => this.flush(), 1200 + Math.random() * 1500); }
      else if (c === 'unavailable' || c === 'resource_exhausted'){ setTimeout(() => this.schedule(), 5000); }
      else if (c === 'quota_exceeded'){ this.status = 'full'; }
      else { this.status = 'local'; this.ref = null; }
    }
    this.writing = false;
    if (this.again) this.flush();
    updateSaveNote();
  }
};
async function initCloud(){
  const C = window.claude;
  if (!C || typeof C.use !== 'function'){ Cloud.status = 'local'; finishBoot(); return; }
  let db = null, user = null, id = null;
  try { [db, user] = await Promise.all([C.use('db'), C.use('user')]); } catch (e){}
  try { id = user ? await user.id() : null; } catch (e){}
  if (!db || !id){ Cloud.status = 'local'; finishBoot(); return; }
  try { Cloud.ref = db.doc('data/users/' + id + '/camel-race'); } catch (e){ Cloud.status = 'local'; finishBoot(); return; }
  Cloud.status = 'loading';
  const t = setTimeout(() => { if (!Cloud.ready){ Cloud.status = 'slow'; finishBoot(); updateSaveNote(); } }, 10000);
  Cloud.ref.onSnapshot(snap => {
    const meta = snap.metadata || {};
    if (meta.hasPendingWrites) return;
    const d = snap.exists ? snap.data() : null;
    if (d && d.by !== TAB){
      const R = normalizeApp(clone(d));
      if ((appIsDemo(A) && !appIsDemo(R)) || (R.updatedAt || 0) > (A.updatedAt || 0)){
        useApp(R); saveLocal(); undoStack.length = 0; fieldSig = ''; renderAll();

      finishBoot(); updateSaveNote();
    }
  }, () => { clearTimeout(t); Cloud.status = 'local'; Cloud.ref = null; finishBoot(); updateSaveNote(); });
}

/* ================= effects ================= */
const FX = (() => {
  const cv = document.getElementById('fx'); const cx = cv.getContext('2d');
  let W = 0, H = 0, parts = [], streaks = [], storm = false, raf = 0;
  const COLS = ['#FFC22E','#1F7AE0','#D93F7A','#1C9A57','#E5701C','#7C4DDB'];
  function size(){ const dpr = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  addEventListener('resize', size); size();
  function spark(x, y, vx, vy, life){ return {x, y, vx, vy, r: 4 + Math.random() * 5, c: COLS[(Math.random() * COLS.length) | 0], rot: Math.random() * 6, vr: (Math.random() - .5) * .3, life, star: Math.random() < .3}; }
  function burst(x, y, n = 40){ if (reduceMotion()) return; for (let i = 0; i < n; i++){ const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 7; parts.push(spark(x, y, Math.cos(a) * v, Math.sin(a) * v - 4, 70 + Math.random() * 40)); } run(); }
  function rain(ms = 2500){ if (reduceMotion()) return; const end = performance.now() + ms; const go = () => { for (let i = 0; i < 7; i++) parts.push(spark(Math.random() * W, -12, (Math.random() - .5) * 2, 2 + Math.random() * 3, 420)); if (performance.now() < end) setTimeout(go, 60); }; go(); run(); }
  function setStorm(on){ storm = on && !reduceMotion(); if (storm) run(); }
  function run(){ if (!raf) raf = requestAnimationFrame(tick); }
  function star(r){ cx.beginPath(); for (let i = 0; i < 10; i++){ const rr = i % 2 ? r * .45 : r, a = Math.PI / 5 * i - Math.PI / 2; cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } cx.closePath(); cx.fill(); }
  function tick(){
    raf = 0; cx.clearRect(0, 0, W, H);
    if (storm) for (let i = 0; i < 9; i++) streaks.push({x: W + 30, y: Math.random() * H, v: 14 + Math.random() * 18, len: 30 + Math.random() * 110, w: 1 + Math.random() * 3, a: .2 + Math.random() * .45});
    streaks = streaks.filter(s => (s.x -= s.v) > -s.len - 20);
    for (const s of streaks){ cx.strokeStyle = `rgba(110,70,25,${s.a})`; cx.lineWidth = s.w; cx.beginPath(); cx.moveTo(s.x, s.y); cx.lineTo(s.x + s.len, s.y + s.len * .08); cx.stroke(); }
    parts = parts.filter(p => p.life-- > 0 && p.y < H + 40);
    for (const p of parts){ p.vy += .18; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c; if (p.star) star(p.r * 1.4); else cx.fillRect(-p.r, -p.r * .6, p.r * 2, p.r * 1.2); cx.restore(); }
    if (parts.length || streaks.length || storm) raf = requestAnimationFrame(tick);
  }
  return {burst, rain, setStorm};
})();

let lastFocus = null;
const POPUPS = ['giftOv', 'finOv', 'stormOv', 'introOv', 'standOv', 'lvlOv', 'mysOv', 'perOv'];

const Q = []; let qTimer = 0;

/* ================= moving camels ================= */
function moveMany(map){
  const r = S.race, len = S.cfg.len, moved = [], hits = [], fin = [];
  Object.keys(map).forEach(id => {
    const d = map[id], s = stu(id);
    if (!s || !d || isDone(id)) return;
    const old = posOf(id), np = clamp(old + d, 0, len);
    if (np === old) return;
    r.pos[id] = np; moved.push([id, d]);
    const gs = r.gifts[id];
    if (d > 0 && S.cfg.surprises && gs != null && !r.taken[id] && old < gs && np >= gs && np < len){ r.taken[id] = 1; hits.push(id); }
    if (np >= len){ r.done.push(id); fin.push(id); if (r.done.length === 1) s.wins = (s.wins || 0) + 1; }
  });
  if (!moved.length) return false;
  commit(); updateLanes();
  moved.forEach(([id, d]) => animateCamel(id, d > 0 ? 'walk' : 'back'));
  if (moved.some(([, d]) => d > 0)) SFX.step(); else SFX.back();
  fin.forEach(id => enqueue(() => celebrate(id)));
  hits.forEach(id => enqueue(() => openSurprise(id)));
  if (fin.length && allFinished()) enqueue(() => openStandings(true));
  return true;
}
const moveOne = (id, d) => moveMany({[id]: d});

}

  s.stars = (s.stars || 0) + 1; s.rs = (s.rs || 0) + 1;

  if (S.cfg.levels && after > before) enqueue(() => levelUp(s.id, after));
}

function presetPeriods(){
  return [
    {k: 'm15', t: `${N(15)} دقيقة`, ms: 15 * 60000},
    {k: 'm30', t: `${N(30)} دقيقة`, ms: 30 * 60000},
    {k: 'm40', t: `حصة (${N(40)} دقيقة)`, ms: 40 * 60000},
    {k: 'day', t: 'حتى نهاية اليوم'},
    {k: 'thu', t: 'حتى نهاية الخميس'},
    {k: 'w1', t: 'أسبوع', days: 7},
    {k: 'w2', t: 'أسبوعان', days: 14},
    {k: 'mo', t: 'شهر', days: 30}
  ];
}
function periodFor(k){
  const now = Date.now(), endOfDay = t => { const d = new Date(t); d.setHours(23, 59, 59, 0); return d.getTime(); };
  if (k === 'custom'){
    const n = clamp(parseInt(($('#perN') || {}).value, 10) || 0, 1, 365), u = ($('#perU') || {}).value === 'min' ? 'min' : 'day';
    return u === 'min' ? {end: now + n * 60000, label: minutesWord(n)} : {end: now + n * 86400000, label: daysWord(n)};
  }
  const p = presetPeriods().find(x => x.k === k); if (!p) return null;
  if (p.ms) return {end: now + p.ms, label: p.t};
  if (p.days) return {end: now + p.days * 86400000, label: p.t};
  if (k === 'day') return {end: endOfDay(now), label: 'اليوم'};
  const d = new Date(now), toThu = (4 - d.getDay() + 7) % 7;
  return {end: endOfDay(now + toThu * 86400000), label: `حتى ${DAYS[4]} ${dayLabel(now + toThu * 86400000)}`};
}
function ptsRanking(pts){
  return S.students.map(s => ({id: s.id, name: s.name, av: s.av, c: s.c, g: s.g, pts: pts[s.id] || 0}))
    .sort((a, b) => b.pts - a.pts || a.name.localeCompare(b.name, 'ar'));
}
function renderPeriod(){

  const left = $('#perLeft'); if (left && on) left.textContent = `باقي ${leftLabel(P.end - Date.now())}`;
}

function finishPeriod(early){
  const P = S.period; if (!P) return;

    return `<div class="pod p${k + 1}" style="--c:${col(x)}"><div class="pod-av">${esc(x.av)}</div><div class="pod-name">${esc(x.name)}</div><div class="pod-block">${MEDALS[Math.min(rank(k), 3) - 1]}<small>${pointsWord(x.pts)}</small></div></div>`;

function spin(){
  if (spinning) return;
  const all = S.students.filter(present);
  if (!all.length){ const n = $('#pickStage .pick-name'); if (n) n.textContent = 'لا يوجد طلاب حاضرون'; return; }
  let pool = all;
  if (S.cfg.noRepeat){ pool = all.filter(s => !S.picked.includes(s.id)); if (!pool.length){ S.picked = []; pool = all; } }
  const win = pick(pool);
  S.picked.push(win.id); commit();
  spinning = true;
  $('#pickBtns').innerHTML = '';
  const delays = []; let dl = 55, sum = 0;
  while (sum < 2300){ delays.push(dl); sum += dl; dl *= 1.12; }
  if (reduceMotion()) delays.length = 0;
  let k = 0, prev = null;
  const step = () => {
    if (!isOpen('pickOv')){ spinning = false; return; }
    if (k < delays.length){
      let s = pick(all); if (all.length > 1) while (s === prev) s = pick(all);
      prev = s; showPick(s, false); SFX.tick(); setTimeout(step, delays[k++]);
    } else {
      showPick(win, true); spinning = false; SFX.ding();
      const st = $('#pickStage'); if (st){ const r = st.getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top + r.height / 2, 46); }
      $('#pickBtns').innerHTML = `<button class="btn go" data-act="pick-good" data-id="${win.id}">⭐ إجابة رائعة</button><button class="btn" data-act="spin">اختيار آخر</button><button class="btn" data-act="close">إغلاق</button>`;
      const b = $('#pickBtns button'); if (b) b.focus({preventScroll: true});
    }
  };
  step();
}

function parseNames(id){

function saveNames(){
  const nb = parseNames('#namesB'), ng = parseNames('#namesG');
  if (!nb.length && !ng.length){ toast({av: '✏️', title: 'لا توجد أسماء', line: 'اكتبي اسما واحدا على الأقل', kind: 'warn'}); return; }
  pushUndo();
  const wasDemo = S.demo, old = wasDemo ? [] : S.students, used = new Set();
  const take = (name, g) => {
    const m = old.find(s => !used.has(s.id) && s.name === name && s.g === g) || old.find(s => !used.has(s.id) && s.name === name);
    if (m){ used.add(m.id); m.g = g; }
    return m;
  };
  const next = [];
  nb.forEach(n => next.push(take(n, 'b') || {name: n, g: 'b', fresh: true}));
  ng.forEach(n => next.push(take(n, 'g') || {name: n, g: 'g', fresh: true}));
  const takenAv = new Set(next.filter(s => !s.fresh).map(s => s.av));
  let ai = 0;
  const nextAv = () => { for (let k = 0; k < AVATARS.length; k++){ const a = AVATARS[(ai + k) % AVATARS.length]; if (!takenAv.has(a)){ ai = (ai + k + 1) % AVATARS.length; takenAv.add(a); return a; } } return AVATARS[(ai++) % AVATARS.length]; };
  S.students = next.map((s, i) => s.fresh ? makeStudent(s.name, s.g, nextAv(), COLORS[i % COLORS.length]) : s);
  const ids = new Set(S.students.map(s => s.id));
  const r = S.race;
  if (wasDemo){
    S.demo = false; r.no = 1; r.pos = {}; r.done = [];
    placeGifts(S);
  } else {
    ['pos', 'gifts', 'taken'].forEach(k => { for (const id in r[k]) if (!ids.has(id)) delete r[k][id]; });
    r.done = r.done.filter(id => ids.has(id));
  }
  S.att.absent = S.att.absent.filter(id => ids.has(id));
  S.picked = S.picked.filter(id => ids.has(id));
  if (S.mystery && !ids.has(S.mystery.id)) S.mystery = null;
  commit(); fieldSig = ''; renderAll(); refreshSettings();
  toast({av: '✅', title: 'تم حفظ الأسماء', line: `الأولاد ${N(nb.length)} · البنات ${N(ng.length)}`, kind: 'good'});
}

async function backup(){
  const name = `camel-race-backup-${today()}.json`, data = JSON.stringify(A, null, 2);
  if (DL){
    try { await DL.save({filename: name, data}); toast({av: '💾', title: 'تم حفظ النسخة الاحتياطية', kind: 'good'}); }
    catch (e){
      const c = e && e.code;
      if (c === 'declined') return;
      if (c === 'unavailable' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed'){ DL = null; refreshSettings(); }
      toast({av: '⚠️', title: 'تعذر تنزيل الملف', line: 'جربي «نسخ البيانات» بدلا من ذلك', kind: 'warn'});
    }
    return;
  }
  try {
    const blob = new Blob([data], {type: 'application/json'});
    const file = typeof File === 'function' ? new File([blob], name, {type: 'application/json'}) : null;
    const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    if (touch && file && navigator.canShare && navigator.canShare({files: [file]})){
      await navigator.share({files: [file], title: 'نسخة سباق الهجن'});
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    }
    toast({av: '💾', title: 'تم تجهيز النسخة الاحتياطية', line: name, kind: 'good'});
  } catch (e){
    if (e && e.name === 'AbortError') return;
    toast({av: '⚠️', title: 'تعذر حفظ الملف', kind: 'warn'});
  }
}

function addClass(){
  const inp = $('#newClassName');
  const name = (inp && inp.value.trim()) || `صف ${N(A.order.length + 1)}`;
  const c = defaultState(false);
  c.cfg = Object.assign(clone(S.cfg), {className: name});
  c.beh = clone(S.beh);
  placeGifts(c);
  const id = 'c' + rid();
  A.classes[id] = c; A.order.push(id);
  switchClass(id, true); commit();
  closeOv('clsOv');
  openSettings('names');
  toast({av: '🏫', title: `تمت إضافة ${name}`, line: 'اكتبي أسماء طلاب هذا الصف', kind: 'good'});
}
function renameClassUI(id){
  const row = document.querySelector(`#clsOv .crow[data-id="${id}"]`); if (!row || !A.classes[id]) return;
  $('.cinfo', row).innerHTML = `<input type="text" class="rename-in" maxlength="40" value="${esc(A.classes[id].cfg.className)}" aria-label="اسم الصف">`;
  $('.cact', row).innerHTML = `<button class="btn go sm" data-act="save-class-name" data-id="${id}">حفظ</button><button class="btn ghost sm" data-act="classes">إلغاء</button>`;
  const i = $('.rename-in', row); i.focus(); i.select();
}
function saveClassName(id){
  const row = document.querySelector(`#clsOv .crow[data-id="${id}"]`), i = row && $('.rename-in', row);
  const v = i && i.value.trim(); if (!v || !A.classes[id]) return;
  A.classes[id].cfg.className = v; commit(); renderTop(); openClasses();
  if (isOpen('introOv')) showIntro();
}
function deleteClass(id){
  const c = A.classes[id]; if (!c || A.order.length < 2) return;
  confirmBox(`حذف ${esc(c.cfg.className)}؟`, 'ستحذف أسماء طلاب هذا الصف ونجومهم وسباقاتهم من هذا الجهاز، ولا يمكن التراجع عن ذلك.', 'حذف الصف', () => {
    delete A.classes[id]; A.order = A.order.filter(x => x !== id);
    if (A.active === id || !A.classes[A.active]) switchClass(A.order[0], true);
    commit(); openClasses();
    if (isOpen('introOv')) showIntro();
    toast({av: '🗑️', title: `تم حذف ${c.cfg.className}`, kind: 'info'});
  }, true);
}

/* ================= installable app ================= */
let installEvt = null;
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function showInstall(){ if (IS_APP && !isStandalone()) $('#installBtn').hidden = false; }
function initApp(){
  if (!IS_APP) return;
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; showInstall(); });
  addEventListener('appinstalled', () => { installEvt = null; $('#installBtn').hidden = true; toast({av: '📲', title: 'تم تثبيت التطبيق', line: 'ستجدينه بين تطبيقات جهازك', kind: 'good'}); });
  if (isIOS()) showInstall();
}
async function installApp(){
  if (installEvt){
    installEvt.prompt();
    try { await installEvt.userChoice; } catch (e){}
    installEvt = null; $('#installBtn').hidden = true;
    return;
  }
  openInstallHelp();
}
function openInstallHelp(){
  openOv('instOv', `
    <button class="x" data-act="close" aria-label="إغلاق">${ICON.x}</button>
    <h2 class="d-title">تثبيت التطبيق</h2>
    <p class="d-text">ثبتي «سباق الهجن» ليظهر بأيقونة خاصة بين تطبيقاتك، ويعمل دون إنترنت.</p>
    <div class="inst-steps">
      <div class="inst"><b>💻 الحاسوب (Chrome أو Edge)</b><span>اضغطي أيقونة التثبيت في آخر شريط العنوان، أو افتحي قائمة المتصفح ثم اختاري «تثبيت سباق الهجن».</span></div>
      <div class="inst"><b>📱 هاتف أندرويد (Chrome)</b><span>افتحي قائمة المتصفح ⋮ ثم اختاري «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».</span></div>
      <div class="inst"><b>📱 آيفون أو آيباد (Safari)</b><span>اضغطي زر المشاركة ثم اختاري «إضافة إلى الشاشة الرئيسية».</span></div>
    </div>
    <p class="hint">تحفظ بيانات الصفوف داخل كل جهاز. لنقلها بين الحاسوب والهاتف: «تنزيل نسخة احتياطية» في جهاز، ثم «استرجاع نسخة» في الجهاز الآخر من الإعدادات.</p>`, 'inst-dialog');
}

/* ================= events ================= */
const ACT = {
  lane: el => { const id = el.dataset.id; if (attMode) toggleAbsent(id); else if (selMode) selPick(id); else openStudent(id); },
  give: el => give(el.dataset.id, el.dataset.b, el),
  warn: el => warnStu(el.dataset.id, el.dataset.b),
  unstar: el => unstar(el.dataset.id),
  'av-next': el => cycleAvatar(el.dataset.id),
  'stu-absent': el => { closeOv('stuOv'); toggleAbsent(el.dataset.id); },
  close: el => { const ov = el.closest('.overlay'); if (ov) closeOv(ov.id); },
  picker: openPicker, spin,
  'pick-good': el => give(el.dataset.id, (S.beh.pos.find(b => b.id === 'p5') || S.beh.pos[0]).id, el),
  'class-all': classAll,
  period: openPeriod,
  'per-start': el => startPeriod(el.dataset.k),
  'per-end': () => { pushUndo(); finishPeriod(true); },
  'per-cancel': () => confirmBox('إلغاء المسابقة؟', 'ستلغى المسابقة الجارية دون إعلان نتائج.', 'إلغاء المسابقة', () => { pushUndo(); S.period = null; commit(); closeOv('perOv'); renderPeriod(); updateLanes(); toast({av: '🏆', title: 'تم إلغاء المسابقة', kind: 'info'}); }, true),
  'per-show': el => showPeriodResults(+el.dataset.i, false),
  'per-new': () => { closeOv('perOv'); setTimeout(openPeriod, 50); },
  mystery: openMystery, 'mys-pick': mysteryPick, 'mys-win': mysteryReveal, 'mys-fail': mysteryFail, 'mys-peek': el => mysteryPeek(el),
  'mys-reward': el => mysteryReward(el.dataset.id),
  'mys-cancel': () => { pushUndo(); S.mystery = null; commit(); renderMystery(); closeOv('mysOv'); toast({av: '🕵️', title: 'تم إلغاء الطالب الغامض', kind: 'info'}); },
  select: toggleSel, 'sel-good': selGood, 'sel-warn': selWarn, 'sel-unstar': selUnstar, 'sel-all': selAll,
  quiet: openQuiet,
  'q-dur': el => { quiet.dur = +el.dataset.s; $$('#quietOv .chipbtn').forEach(b => b.classList.toggle('sel', b === el)); },
  'q-start': quietStart, 'q-fail': quietFail, 'q-done': quietDone,
  storm: startStorm, calm: endStorm,
  'gift-open': el => giftOpen(el.dataset.id),
  'gift-ok': el => giftOk(el.dataset.id, el.dataset.k),
  'gift-skip': () => { closeOv('giftOv'); toast({av: '💪', title: 'لا بأس', line: 'المرة القادمة إن شاء الله', kind: 'info'}); },
  friend: el => friendPick(el.dataset.id, el.dataset.f),
  'quiz-yes': el => quizYes(el.dataset.id),
  standings: () => openStandings(false),
  attendance: toggleAtt,
  'att-all': () => { pushUndo(); S.att.absent = []; commit(); updateLanes(); updateAttBar(); },
  classes: () => { closeOv('setOv'); openClasses(); },
  install: installApp, 'install-help': () => { closeOv('setOv'); openInstallHelp(); },
  'switch-class': el => { switchClass(el.dataset.id); closeOv('clsOv'); },
  'intro-class': el => switchClass(el.dataset.id, true),
  'add-class': addClass,
  'rename-class': el => renameClassUI(el.dataset.id),
  'save-class-name': el => saveClassName(el.dataset.id),
  'del-class': el => deleteClass(el.dataset.id),
  undo, 'new-race': askNewRace, 'reset-all': askResetAll, 'do-reset-all': resetAll,
  sound: () => { setGlobal('sound', !S.cfg.sound); commit(); renderTop(); if (S.cfg.sound) SFX.ding(); },
  fullscreen: async () => {
    try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); }
    catch (e){ toast({av: '🖥️', title: 'تعذر ملء الشاشة هنا', line: 'افتحي اللعبة في صفحة مستقلة ثم جربي مرة أخرى', kind: 'info'}); }
  },
  settings: () => openSettings(),
  'open-names': () => openSettings('names'),
  help: showIntro, start: startGame,
  tab: el => { setTab = el.dataset.t; refreshSettings(); },
  'save-names': saveNames,
  len: el => {
    const n = +el.dataset.n; if (S.cfg.len === n) return;
    pushUndo(); S.cfg.len = n; resetRaceAll(); commit(); fieldSig = ''; renderAll(); refreshSettings();
  },
  digits: el => { setGlobal('digits', el.dataset.d); commit(); fieldSig = ''; renderAll(); refreshSettings(); },
  'add-beh': el => {
    const k = el.dataset.k, list = $(k === 'pos' ? '#posList' : '#negList');
    list.insertAdjacentHTML('beforeend', behRow({id: (k === 'pos' ? 'p' : 'n') + rid(), e: k === 'pos' ? '⭐' : '💬', t: '', tip: ''}, k));
    const inp = $('.beh-row:last-child .bt', list); if (inp) inp.focus();
  },
  'del-beh': el => { const row = el.closest('.beh-row'); if (row) row.remove(); },
  'save-beh': saveBeh,
  backup, 'copy-backup': copyBackup,
  import: () => $('#importFile').click(),
  'reset-stars': () => confirmBox('تصفير النجوم؟', 'ستعود نجوم كل الطلاب إلى صفر، وتعود جمالهم إلى المستوى الأول.', 'تصفير النجوم', () => { pushUndo(); S.students.forEach(s => { s.stars = 0; s.rs = 0; s.rem = 0; }); commit(); updateLanes(); toast({av: '✅', title: 'تم تصفير النجوم', kind: 'good'}); }),
  'reset-wins': () => confirmBox('تصفير مرات الفوز؟', 'سيعود عدد مرات فوز كل طالب إلى صفر.', 'تصفير', () => { pushUndo(); S.students.forEach(s => { s.wins = 0; }); commit(); toast({av: '✅', title: 'تم التصفير', kind: 'good'}); }),
  wipe: () => confirmBox('حذف بيانات هذا الصف؟', 'ستحذف أسماء طلاب هذا الصف ونجومهم وسباقاتهم، وتبقى إعداداته. يمكن التراجع مباشرة بعد الحذف.', 'حذف بيانات الصف', () => { pushUndo(); const c = defaultState(false); c.cfg = clone(S.cfg); c.beh = clone(S.beh); setS(c); commit(); fieldSig = ''; renderAll(); openSettings('names'); }, true),
  'confirm-yes': () => { const f = confirmFn; confirmFn = null; closeOv('confirmOv'); if (f) f(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el){
    const ov = e.target.classList && e.target.classList.contains('overlay') ? e.target : null;
    if (ov && ['stuOv', 'setOv', 'confirmOv', 'standOv', 'clsOv', 'instOv'].includes(ov.id)) closeOv(ov.id);
    if (ov && ov.id === 'pickOv' && !spinning) closeOv(ov.id);
    return;
  }
  if (el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('pointerdown', () => SFX.unlock(), true);
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('[data-set]')){
    const k = el.dataset.set;
    if (k === 'sound') setGlobal('sound', el.checked); else S.cfg[k] = el.checked;
    if (k === 'surprises'){ pushUndo(); placeGifts(S); }
    commit(); fieldSig = ''; renderAll();
    if (k === 'sound' && el.checked) SFX.ding();
  } else if (el.matches('[data-cfg]')){
    const v = el.value.trim(), k = el.dataset.cfg;
    if (k === 'teacher' || k === 'school') setGlobal(k, v);
    else { if (!v) return; S.cfg[k] = v; }
    commit(); renderTop();
  } else if (el.id === 'importFile' && el.files && el.files[0]){
    importFile(el.files[0]); el.value = '';
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  for (const id of ['confirmOv', 'instOv', 'clsOv', 'setOv', 'stuOv', 'pickOv', 'quietOv', 'standOv', 'mysOv', 'perOv']) if (isOpen(id)){ if (id === 'pickOv' && spinning) return; closeOv(id); return; }
  if (isOpen('introOv')){ startGame(); return; }
  if (attMode) toggleAtt(); else if (selMode) toggleSel();
});

/* ================= boot ================= */
let booted = false;
function finishBoot(){ if (booted) return; booted = true; closeOv('loadOv'); fieldSig = ''; renderAll(); showIntro(); }
let lastCols = 0;
function onResize(){ const c = nCols(); if (c !== lastCols){ lastCols = c; fieldSig = ''; renderField(); } else sizeField(); }
function boot(){
  $$('[data-icon]').forEach(b => b.insertAdjacentHTML('afterbegin', ICON[b.dataset.icon] || ''));
  $('#brandMark').innerHTML = camelSVG('#FFC22E', '⭐', 4);
  $('#fsBtn').hidden = !document.fullscreenEnabled;
  const local = loadLocal();
  useApp(local ? normalizeApp(local) : newApp(true));
  if (local) saveLocal();
  lastCols = nCols();
  renderAll();
  if ('ResizeObserver' in window) new ResizeObserver(onResize).observe($('#field'));
  addEventListener('resize', onResize);
  if (local){ booted = true; showIntro(); }
  else {
    const ov = overlay('loadOv', 'loading-ov'), box = $('.dialog', ov);
    box.className = 'loading'; box.innerHTML = '<div class="spinner"></div><p>جار تحميل بيانات الصف…</p>';
    ov.hidden = false;
  }
  checkDay();
  setInterval(checkDay, 60000);
  setInterval(tickPeriod, 1000);
  initCloud();
  initDownloads();
  initApp();
}
boot();
})();

</script>
